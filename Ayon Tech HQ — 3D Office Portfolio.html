 if(gu.path.length){const q=gu.path[0],dx=q[0]-gp.x,dz=q[1]-gp.z,d=Math.hypot(dx,dz);if(d<.2){gu.path.shift();if(!gu.path.length&&gu.cb){const f=gu.cb;gu.cb=null;f()}}else{gp.x+=dx/d*Math.min(d,dt*4.2);gp.z+=dz/d*Math.min(d,dt*4.2);girl.rotation.y=Math.atan2(dx,dz);walking=true}}else girl.rotation.y*=.9;
 gu.lL.rotation.x=walking?Math.sin(t*9)*.6:0;gu.lR.rotation.x=walking?-Math.sin(t*9)*.6:0;gu.aL.rotation.x=walking?-Math.sin(t*9)*.5:0;
 gu.aR.rotation.x=walking?Math.sin(t*9)*.5:0;gu.aR.rotation.z=(wave>t)?2.6+Math.sin(t*9)*.3:0;
 (window.leds||[]).forEach((l,i)=>l.visible=Math.sin(t*6+i*7.3)>-.3);
 cars.forEach(c=>{const u=c.userData,k=u.d*u.sp*dt;if(u.back){c.position.x+=k;if(c.position.x>110)c.position.x=-110;if(c.position.x<-110)c.position.x=110}else{c.position.z+=k;if(c.position.z>90)c.position.z=-110;if(c.position.z<-110)c.position.z=90}});
 walkers.forEach((p,i)=>{const u=p.userData.w,k=u.d*u.sp*dt,a=Math.sin(t*7+i)*.6,r=p.userData;if(u.back){p.position.x+=k;if(Math.abs(p.position.x)>70)u.d*=-1;p.rotation.y=u.d>0?1.57:-1.57}else{p.position.z+=k;if(p.position.z>40||p.position.z<-70)u.d*=-1;p.rotation.y=u.d>0?0:Math.PI}
  r.lL.rotation.x=a;r.lR.rotation.x=-a;r.aL.rotation.x=-a*.8;r.aR.rotation.x=a*.8});
 R.render(S,C)}

/* ---------- dialogue UI ---------- */
let tw;function say(who,text,opts,after){$('#panel').style.display='none';$('#say').style.display='block';$('#who').textContent=who;const el=$('#txt'),o=$('#opts');o.innerHTML='';clearInterval(tw);let i=0;el.textContent='';
 tw=setInterval(()=>{el.textContent=text.slice(0,++i);if(i>=text.length){clearInterval(tw);(opts||[]).forEach(([l,f,p])=>{const b=document.createElement('button');b.className='btn'+(p?' p':'');b.textContent=l;b.onclick=f;o.appendChild(b)});after&&after(o)}},18)}
function panel(h){$('#say').style.display='none';const p=$('#panel');p.innerHTML=h;p.style.display='block';p.scrollTop=0}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me=ls('ao_name')||'';

$('#go').onclick=()=>{$('#intro').remove();go([0,1.7,12.8],[0,1.4,8]);setTimeout(()=>{if(me){save('visits',{name:me,returning:true});gwave=clock.elapsedTime+3;say('FBI Agent','Welcome back, '+me+'! Good to see you again at Ayon Tech HQ.',[['Continue →',reception,1],["I'm someone else",()=>{ls('ao_name','');me='';ask()}]])}else ask()},1500)};
function ask(){gwave=clock.elapsedTime+3;say('FBI Agent','Stop right there — friendly security check! Welcome to Ayon Tech HQ. May I have your name, please?',null,o=>{o.innerHTML='<input id="nm" placeholder="Your name" maxlength="40"><button class="btn p" id="nb">That\'s me →</button>';const f=()=>{const v=$('#nm').value.trim();if(!v)return $('#nm').focus();me=v;ls('ao_name',v);save('visits',{name:v});say('FBI Agent','Thank you, '+v+'. You are cleared. Please proceed to reception, '+v+'.',[['Go to reception →',reception,1]])};$('#nb').onclick=f;$('#nm').onkeydown=e=>e.key=='Enter'&&f();$('#nm').focus()})}
function reception(){follow=0;go([0,1.7,3.4],[0,1.5,-4]);wave=clock.elapsedTime+3;say('Receptionist · Sophia','Hello '+me+'! Welcome. I\'m Sophia. What would you like to see today?',[['💼 Project websites',()=>show('p')],['⚡ Skills',()=>show('s')],['👤 CEO details',()=>show('c')],['📅 Book / Hire the CEO',hire,1]])}
const back='<p><button class="btn" onclick="reception()">← Back to reception</button></p>';
function show(k){let h='';
 if(k=='p')h='<h2>💼 Project websites</h2>'+PROJECTS.map(p=>`<div class="card"><b>${esc(p.n)}</b><br>${esc(p.d)}<br><a class="btn" target="_blank" rel="noopener" href="${esc(p.u)}">Open ↗</a></div>`).join('');
 if(k=='s')h='<h2>⚡ Skills</h2>'+SKILLS.map(s=>`<div>${s[0]} — ${s[1]}%</div><div class="bar"><i style="width:${s[1]}%"></i></div>`).join('');
 if(k=='c')h=`<h2>👤 ${esc(CEO.name)}</h2><p>Founder &amp; CEO — Web, Python &amp; Java developer.</p><a class="btn" href="tel:${CEO.phone}">📞 ${CEO.phone}</a><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${CEO.wa}">💬 WhatsApp +${CEO.wa}</a><a class="btn" href="mailto:${CEO.mail}">✉️ ${CEO.mail}</a><a class="btn" target="_blank" rel="noopener" href="https://github.com/${CEO.gh}">🐙 GitHub</a><a class="btn" target="_blank" rel="noopener" href="${CEO.fb}">Facebook</a><a class="btn" target="_blank" rel="noopener" href="${CEO.ig}">Instagram</a>`;
 panel(h+back)}
function hire(){go([0,1.7,3.4],[0,1.5,-4]);say('Receptionist · Sophia','Wonderful, '+me+'! Please follow me — the CEO\'s office is at the very end.',null);const u=girl.userData;u.path=[[4.4,-4.4],[4.4,-30],[2.8,-35]];follow=1;
 u.cb=()=>{follow=0;go([0,1.8,-28.5],[0,1.5,-40]);wave=clock.elapsedTime+3;say('Receptionist · Sophia','Here we are! The CEO is ready for you. Please leave your details.',null);setTimeout(form,1800)}}
function form(){panel(`<h2>📅 Meet the CEO</h2><p>Hi ${esc(me)}, tell ${esc(CEO.name)} what you need.</p>
<label>Your email *</label><input id="fe" type="email" placeholder="you@example.com">
<label>Phone / WhatsApp</label><input id="fp" placeholder="+880…">
<label>I need</label><select id="ft"><option>Hire an employee</option><option>A project / website</option><option>Book a meeting with the CEO</option><option>Other</option></select>
<label>Project / role details</label><textarea id="fm" rows="3" placeholder="Describe what you need, budget, deadline…"></textarea>
<button class="btn p" id="fs">Send to CEO →</button> <button class="btn" id="fb">← Back to reception</button><div id="fr"></div>`);
 $('#fb').onclick=()=>{panel('');$('#panel').style.display='none';say('Receptionist · Sophia','Of course, let me walk you back.',null);const u=girl.userData;u.path=[[4.4,-30],[4.4,-4.4],[0,-4.4]];follow=-1;u.cb=reception};
 $('#fs').onclick=()=>{const e=$('#fe').value.trim();if(!/^\S+@\S+\.\S+$/.test(e))return $('#fr').innerHTML='<p>Please enter a valid email.</p>';
  const d={name:me,email:e,phone:$('#fp').value.trim(),need:$('#ft').value,msg:$('#fm').value.trim()};save('hires',d);
  const txt=`Hi ${CEO.name}, I'm ${d.name}. I need: ${d.need}. ${d.msg} (Email: ${d.email}${d.phone?', Phone: '+d.phone:''})`;
  $('#fr').innerHTML=`<div class="card">✅ Request saved, ${esc(me)}! To reach the CEO instantly, also send it directly:<br><a class="btn p" target="_blank" rel="noopener" href="https://wa.me/${CEO.wa}?text=${encodeURIComponent(txt)}">Send via WhatsApp</a><a class="btn" href="mailto:${CEO.mail}?subject=${encodeURIComponent('Hire request from '+d.name)}&body=${encodeURIComponent(txt)}">Send via Email</a></div>`}}

async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
$('#adm').onclick=()=>{panel('<h2>🔒 Admin portal</h2><input id="ap" type="password" placeholder="Password"><button class="btn p" id="al">Unlock</button> <button class="btn" id="ac">Close</button><div id="ae"></div>');
 $('#ac').onclick=()=>{$('#panel').style.display='none';if(me)$('#say').style.display='block'};
 const f=async()=>{let ok=false;try{ok=(await sha($('#ap').value))===ADMIN_HASH}catch(e){}if(!ok)return $('#ae').textContent='Wrong password.';admin()};$('#al').onclick=f;$('#ap').onkeydown=e=>e.key=='Enter'&&f()};
async function rows(k){let a=[];try{a=JSON.parse(ls('ao_'+k)||'[]')}catch(e){}
 try{if(DB){const s=await DB.collection(k).get();s.docs.forEach(d=>a.push(d.data()))}}catch(e){}
 const seen=new Set();return a.filter(r=>{const id=r.t+r.name;if(seen.has(id))return false;seen.add(id);return true}).sort((x,y)=>y.t-x.t)}
async function admin(){const v=await rows('visits'),h=await rows('hires'),dt=t=>new Date(t).toLocaleString();
 panel(`<h2>🛠 Admin portal</h2><h3>Hire / booking requests (${h.length})</h3>`+(h.map(r=>`<div class="card"><b>${esc(r.name)}</b> — ${esc(r.need)}<br>✉️ ${esc(r.email)} ${r.phone?'· 📞 '+esc(r.phone):''}<br>${esc(r.msg||'')}<br><small>${dt(r.t)}</small></div>`).join('')||'<p>None yet.</p>')+
 `<h3>Visitors (${v.length})</h3><div class="tbl">`+(v.map(r=>`<div>${esc(r.name)}${r.returning?' (returning)':''} — <small>${dt(r.t)}</small></div>`).join('')||'<p>None yet.</p>')+`</div><p><button class="btn" id="ac2">Close</button></p>`);
 $('#ac2').onclick=()=>{$('#panel').style.display='none'}}

$('#ld').remove();$('#intro').style.display='flex';
const lc=(a,b)=>{};R.setClearColor(0x9fd0f5);C.position.copy(cur.p);loop();
